[package]
name = "omaread"
version = "0.1.0"
edition = "2024"

[dependencies]
# Screen-reader support (CONTEXT.md §7): the tree types, and the winit adapter
# that hands them to AT-SPI. Not blitz-dom's 0.17: see a11y.rs for why.
accesskit = "0.25"
accesskit_winit = "0.34.1"
anyrender = "0.6"
anyrender_vello_cpu = { version = "=0.8.1", features = ["softbuffer_window_renderer"] }
blitz-dom = "0.2.4"
blitz-html = "0.2.0"
blitz-paint = "0.2.1"
blitz-traits = "0.2.0"
# UI strings (CONTEXT.md §12), one .ftl per language in assets/i18n/.
fluent-bundle = "0.16"
hyphenation = { version = "0.8.4", features = ["embed_all"] }
# Already in the tree, pinned by blitz-dom. Named directly to shrink covers:
# a card is 225px wide and publishers ship 2100px, which is 4.5MB of RGBA each.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
kurbo = "0.12"
# Pinned by blitz-dom; named directly for text selection (Cursor/Selection).
parley = "0.6"
peniko = "0.5"
rbook = "0.7.10"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.0"
# Already in the tree, pinned by blitz-dom. Named directly to find a font's
# hyphen glyph, which paint.rs draws at soft-hyphen breaks.
skrifa = "0.37"
# The language tag fluent-bundle takes; the version it pins.
unic-langid = "0.9"
winit = "0.30.13"
# Already in the tree, through AccessKit's AT-SPI bridge. Named directly to ask
# xdg-desktop-portal for a file or folder (portal.rs).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
# Already in the tree, pinned by blitz-dom. Only the font test names it: it
# needs `Blob` to hand a bundled face to a `Collection` directly.
fontique = "0.6"
